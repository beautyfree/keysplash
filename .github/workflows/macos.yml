name: macOS app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Build and package KeySplash
        run: |
          ./build-app.sh
          ditto -c -k --sequesterRsrc --keepParent dist/KeySplash.app KeySplash-macOS.zip
      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: KeySplash-macOS
          path: KeySplash-macOS.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Download app archive
        uses: actions/download-artifact@v7
        with:
          name: KeySplash-macOS
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/KeySplash-macOS.zip --generate-notes
